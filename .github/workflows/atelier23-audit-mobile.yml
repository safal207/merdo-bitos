name: Atelier 23 audit mobile QA
on:
  push:
    branches: [audit/atelier23-client-review]
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - run: node scripts/atelier23-audit-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier23-audit-mobile
          path: artifacts/audit-mobile/
          if-no-files-found: ignore
