name: Atelier 23 client readiness preview
on:
  push:
    branches: [audit/atelier23-emotional-preview]
permissions:
  contents: read
jobs:
  offline-preview:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - run: node scripts/atelier23-client-preview.mjs
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        with:
          name: atelier23-client-readiness-preview
          path: artifacts/client-preview/
          if-no-files-found: error
