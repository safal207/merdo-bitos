name: Atelier 23 — live image release check

on:
  pull_request:
    branches: [main]
    paths:
      - 'atelier23/fashion-overlay/**'
      - 'scripts/atelier23-image-live.mjs'
      - '.github/workflows/atelier23-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser client
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Decode live official images and X card
        run: node scripts/atelier23-image-live.mjs
