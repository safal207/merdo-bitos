name: External storefront QA (read only)
on:
  push:
    branches: [qa/external-site-audit-20261124]
    paths: [.github/workflows/external-storefront-qa.yml, scripts/external-storefront-qa.mjs]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/external-storefront-qa.mjs
        env:
          QA_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: qa-evidence/
          retention-days: 3
