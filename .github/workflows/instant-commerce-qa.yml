name: Instant Commerce QA
on:
  push:
    branches: [feat/atelier23-instant-commerce]
    paths:
      - atelier23/instant-commerce/**
      - scripts/instant-commerce-qa.mjs
      - .github/workflows/instant-commerce-qa.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/instant-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/atelier23/instant-commerce/a/ >/dev/null && break; sleep 1; done
          node scripts/instant-commerce-qa.mjs
        env:
          QA_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-browser-${{ matrix.engine }}
          path: instant-evidence/
          retention-days: 3
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false lighthouse@12.4.0
      - name: Measure each concept three times
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/instant-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/atelier23/instant-commerce/a/ >/dev/null && break; sleep 1; done
          mkdir -p instant-lighthouse
          flags=()
          if [ "$DEVICE" = desktop ]; then flags+=(--preset=desktop); fi
          for variant in a b; do
            for repeat in 1 2 3; do
              timeout 150s npx lighthouse "http://127.0.0.1:8080/atelier23/instant-commerce/$variant/" "${flags[@]}" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility --output=json --output-path="instant-lighthouse/$variant-$repeat.json" --quiet
            done
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const rows=fs.readdirSync('instant-lighthouse').filter(f=>f.endsWith('.json')).map(f=>{
            const r=JSON.parse(fs.readFileSync('instant-lighthouse/'+f));
            if(r.runtimeError)throw Error(JSON.stringify(r.runtimeError));
            return {file:f,performance:r.categories.performance.score*100,accessibility:r.categories.accessibility.score*100,lcp:r.audits['largest-contentful-paint'].numericValue,cls:r.audits['cumulative-layout-shift'].numericValue,tbt:r.audits['total-blocking-time'].numericValue,fcp:r.audits['first-contentful-paint'].numericValue,warnings:r.runWarnings};
          });
          if(rows.length!==6)throw Error('Expected six measurements');
          fs.writeFileSync('instant-lighthouse/summary.json',JSON.stringify(rows,null,2));
          console.log(JSON.stringify(rows));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-lighthouse-${{ matrix.device }}
          path: instant-lighthouse/
          retention-days: 3
