name: BitOS PLF Launch Engine QA
on:
  push:
    branches: [feat/bitos-plf-launch-engine]
  pull_request:
    branches: [feat/atelier23-instagram-commerce]
permissions:
  contents: read
jobs:
  launch-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --init --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/launch-engine-unit.mjs
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - run: node scripts/launch-engine-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-engine-qa
          path: artifacts/launch-engine/
          if-no-files-found: ignore
