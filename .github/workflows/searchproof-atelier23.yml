name: Atelier 23 SearchProof QA
on:
  push:
    branches: [qa/searchproof-atelier23-audit]
    paths:
      - scripts/searchproof-atelier23-qa.mjs
      - .github/workflows/searchproof-atelier23.yml
permissions:
  contents: read
concurrency:
  group: atelier23-searchproof-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: safal207/SearchProof-SEO-Evidence
          ref: 67366c17ace5a383e68f8ebf3cf45f2960bcfe8c
          path: searchproof
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify upstream deterministic tests
        working-directory: searchproof
        run: npm run verify
      - name: Run bounded public audit
        run: node scripts/searchproof-atelier23-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier23-searchproof-evidence
          path: qa-searchproof-evidence/
          retention-days: 3
          if-no-files-found: warn
